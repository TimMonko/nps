[project]
name = "nps"
version = "0.1.0"
description = "napari plugin sustainability efforts and organization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Tim Monko" },
    { email = "timmonko@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.3.3",
    "requests>=2.32",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "altair>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
plot = [
    "plotly>=6.9.0",
]
notebook = [
    "marimo>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "vl-convert-python>=1.9.0.post1",
]
site = [
    "jupyter>=1.1.1",
    "quarto-cli>=1.11",
]

[project]
name = "nps"
version = "0.1.0"
description = "napari plugin sustainability efforts and organization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Tim Monko" },
    { email = "timmonko@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.3.3",
    "requests>=2.32",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "altair>=5.5",
    "vl-convert-python>=1.9",
]

[project.optional-dependencies]
plot = [
    "plotly>=6.9.0",
]
notebook = [
    "marimo>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
site = [
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# marimo: re-run cells when an imported module (src/nps) changes on disk
[tool.marimo.runtime]
auto_reload = "autorun"

# pixi manages every environment: dependency groups and extras map to
# features of the same name; conda-only tools (Quarto) come from conda-forge.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
nps = { path = ".", editable = true }

[tool.pixi.tasks]
pipeline = "python scripts/run_all.py"
recompute = { cmd = "python scripts/run_all.py --skip-fetch", description = "Recompute metrics and plots from cached data (no network)" }

[tool.pixi.feature.dev.tasks]
test = "pytest"

[tool.pixi.feature.site.dependencies]
quarto = ">=1.11"

[tool.pixi.feature.site.tasks]
render = "quarto render"
preview = "quarto preview"

[tool.pixi.feature.notebook.tasks]
explore = "marimo edit notebooks"
gallery = { cmd = "marimo edit notebooks/plot_gallery.py", description = "Every plot in both themes; redraws when src/nps changes" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
site = { features = ["site"], solve-group = "default" }
plot = { features = ["plot"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
